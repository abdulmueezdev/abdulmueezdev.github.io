<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <linearGradient id="bg-app" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1b1f" />
      <stop offset="100%" stop-color="#121114" />
    </linearGradient>
    <pattern id="dot-grid-app" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2c2a2f" />
    </pattern>
  </defs>

  <rect width="400" height="500" fill="url(#bg-app)" />
  <rect width="400" height="500" fill="url(#dot-grid-app)" opacity="0.75" />

  <rect x="30" y="30" width="340" height="440" stroke="#2c2a2f" stroke-width="1" rx="16" />

  <!-- Mobile Hardware Frame & Interface -->
  <g transform="translate(200, 240)">
    <!-- Device Outer Chassis -->
    <rect x="-75" y="-130" width="150" height="250" rx="26" fill="#141316" stroke="#555358" stroke-width="1.6" />
    <!-- Dynamic Island / Speaker Notch -->
    <rect x="-22" y="-118" width="44" height="11" rx="5.5" fill="#000000" stroke="#2c2a2f" stroke-width="0.8" />
    <circle cx="12" cy="-112.5" r="2.5" fill="#ff6436" opacity="0.7" />

    <!-- Screen Perimeter -->
    <rect x="-66" y="-100" width="132" height="205" rx="14" fill="#1a191e" stroke="#2c2a2f" stroke-width="1" />

    <!-- App Bar -->
    <rect x="-56" y="-88" width="112" height="20" rx="4" fill="#232128" />
    <circle cx="-42" cy="-78" r="3.5" fill="#ff6436" />
    <line x1="-32" y1="-78" x2="20" y2="-78" stroke="#88858a" stroke-width="2" stroke-linecap="round" />

    <!-- Hero Card Component -->
    <rect x="-56" y="-58" width="112" height="56" rx="8" fill="#242229" stroke="#3c3a3e" stroke-width="1.2" />
    <circle cx="-35" cy="-30" r="13" fill="#18171b" stroke="#ff6436" stroke-width="1.5" />
    <polygon points="-38,-35 -31,-30 -38,-25" fill="#ff6436" />
    <line x1="-14" y1="-35" x2="40" y2="-35" stroke="#f8f8f8" stroke-width="2.2" stroke-linecap="round" />
    <line x1="-14" y1="-25" x2="20" y2="-25" stroke="#88858a" stroke-width="1.5" stroke-linecap="round" />

    <!-- Interactive Button with Capacitive Haptic Wave -->
    <g transform="translate(0, 30)">
      <rect x="-56" y="-12" width="112" height="32" rx="16" fill="#ff6436" />
      <line x1="-25" y1="4" x2="25" y2="4" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <!-- Haptic Wave Rings -->
      <circle cx="0" cy="4" r="24" fill="none" stroke="#ff6436" stroke-width="1" stroke-dasharray="3 3" opacity="0.85" />
      <circle cx="0" cy="4" r="36" fill="none" stroke="#ff6436" stroke-width="0.8" opacity="0.4" />
    </g>

    <!-- Bottom Gesture Bar -->
    <rect x="-26" y="92" width="52" height="3.5" rx="1.75" fill="#88858a" />
  </g>
</svg>
