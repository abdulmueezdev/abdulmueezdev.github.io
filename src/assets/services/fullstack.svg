<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <linearGradient id="bg-fs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1b1f" />
      <stop offset="100%" stop-color="#121114" />
    </linearGradient>
    <pattern id="dot-grid-fs" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2c2a2f" />
    </pattern>
  </defs>

  <rect width="400" height="500" fill="url(#bg-fs)" />
  <rect width="400" height="500" fill="url(#dot-grid-fs)" opacity="0.75" />

  <rect x="30" y="30" width="340" height="440" stroke="#2c2a2f" stroke-width="1" rx="16" />

  <!-- Layered Architecture Stack Cut -->
  <g transform="translate(200, 240)">
    <!-- Vertical Spine / Data Highway -->
    <line x1="0" y1="-130" x2="0" y2="120" stroke="#ff6436" stroke-width="2" />
    <circle cx="0" cy="-125" r="4" fill="#ff6436" />
    <circle cx="0" cy="115" r="4" fill="#ff6436" />

    <!-- 1. Top Tier: UI & Client State Layer -->
    <g transform="translate(0, -90)">
      <rect x="-115" y="-28" width="230" height="56" fill="#1b1a1f" stroke="#3c3a3e" stroke-width="1.2" rx="6" />
      <rect x="-100" y="-18" width="40" height="36" fill="#151417" stroke="#555358" stroke-width="1" rx="4" />
      <rect x="-50" y="-18" width="100" height="36" fill="#151417" stroke="#ff6436" stroke-width="1.2" rx="4" />
      <rect x="60" y="-18" width="40" height="36" fill="#151417" stroke="#555358" stroke-width="1" rx="4" />
      <circle cx="-80" cy="0" r="3" fill="#ff6436" />
      <circle cx="0" cy="0" r="4" fill="#ffffff" />
      <circle cx="80" cy="0" r="3" fill="#c9c7cc" />
    </g>

    <!-- Connective Gateway 1 to 2 -->
    <g transform="translate(0, -45)">
      <circle cx="0" cy="0" r="10" fill="#151417" stroke="#ff6436" stroke-width="1.6" />
      <polygon points="-3,-4 3,0 -3,4" fill="#ff6436" />
    </g>

    <!-- 2. Middle Tier: API Gateway & Worker Nodes -->
    <g transform="translate(0, 0)">
      <rect x="-115" y="-28" width="230" height="56" fill="#18171b" stroke="#555358" stroke-width="1.2" rx="6" />
      <g transform="translate(-75, 0)">
        <circle cx="0" cy="0" r="13" fill="#141316" stroke="#ff6436" stroke-width="1.4" />
      </g>
      <g transform="translate(-25, 0)">
        <circle cx="0" cy="0" r="13" fill="#141316" stroke="#c9c7cc" stroke-width="1.2" />
      </g>
      <g transform="translate(25, 0)">
        <circle cx="0" cy="0" r="13" fill="#141316" stroke="#ff6436" stroke-width="1.4" />
      </g>
      <g transform="translate(75, 0)">
        <circle cx="0" cy="0" r="13" fill="#141316" stroke="#c9c7cc" stroke-width="1.2" />
      </g>
      <line x1="-62" y1="0" x2="-38" y2="0" stroke="#555358" stroke-width="1" stroke-dasharray="2 2" />
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#ff6436" stroke-width="1.5" />
      <line x1="38" y1="0" x2="62" y2="0" stroke="#555358" stroke-width="1" stroke-dasharray="2 2" />
    </g>

    <!-- Connective Gateway 2 to 3 -->
    <g transform="translate(0, 45)">
      <circle cx="0" cy="0" r="10" fill="#151417" stroke="#ff6436" stroke-width="1.6" />
      <polygon points="-3,-4 3,0 -3,4" fill="#ff6436" />
    </g>

    <!-- 3. Bottom Tier: Database & Persistence Layer -->
    <g transform="translate(0, 90)">
      <rect x="-115" y="-28" width="230" height="56" fill="#161519" stroke="#3c3a3e" stroke-width="1.2" rx="6" />
      <rect x="-95" y="-16" width="55" height="32" fill="#1d1c21" stroke="#3c3a3e" stroke-width="1" rx="4" />
      <rect x="-30" y="-16" width="60" height="32" fill="#1d1c21" stroke="#ff6436" stroke-width="1.4" rx="4" />
      <rect x="40" y="-16" width="55" height="32" fill="#1d1c21" stroke="#3c3a3e" stroke-width="1" rx="4" />
      <circle cx="0" cy="0" r="3.5" fill="#ff6436" />
    </g>
  </g>
</svg>
