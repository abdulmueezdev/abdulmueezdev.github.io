<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <linearGradient id="bg-voice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1b1f" />
      <stop offset="100%" stop-color="#121114" />
    </linearGradient>
    <pattern id="dot-grid-voice" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2c2a2f" />
    </pattern>
  </defs>

  <rect width="400" height="500" fill="url(#bg-voice)" />
  <rect width="400" height="500" fill="url(#dot-grid-voice)" opacity="0.75" />

  <rect x="30" y="30" width="340" height="440" stroke="#2c2a2f" stroke-width="1" rx="16" />

  <!-- Acoustic Duplex Waveforms & Spectrum -->
  <g transform="translate(200, 240)">
    <!-- Central Resonant Acoustic Core -->
    <circle cx="0" cy="0" r="42" fill="#151418" stroke="#3c3a3e" stroke-width="1.6" />
    <circle cx="0" cy="0" r="26" fill="#1b1a1f" stroke="#ff6436" stroke-width="2" />
    <circle cx="0" cy="0" r="11" fill="#ff6436" />

    <!-- Dynamic Acoustic Shockwave Ellipses -->
    <ellipse cx="0" cy="0" rx="60" ry="50" fill="none" stroke="#ff6436" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.8" />
    <ellipse cx="0" cy="0" rx="85" ry="70" fill="none" stroke="#555358" stroke-width="0.9" stroke-dasharray="2 3" opacity="0.55" />
    <ellipse cx="0" cy="0" rx="115" ry="95" fill="none" stroke="#3c3a3e" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.35" />

    <!-- Upper Waveform Ribbon (User Voice In) -->
    <path d="M -120 -70 Q -90 -95, -60 -70 T 0 -70 T 60 -70 T 120 -70" fill="none" stroke="#555358" stroke-width="1.8" stroke-dasharray="3 3" />

    <!-- Lower Synthesized Duplex Audio Waveform (Ember Out) -->
    <path d="M -120 70 Q -90 45, -60 70 T 0 70 T 60 70 T 120 70" fill="none" stroke="#ff6436" stroke-width="2.2" />

    <!-- Spectrogram Frequency EQ Columns Left & Right -->
    <g transform="translate(-115, -30)">
      <rect x="0" y="10" width="4.5" height="50" fill="#ff6436" rx="1" />
      <rect x="8" y="0" width="4.5" height="60" fill="#ff6436" rx="1" />
      <rect x="16" y="25" width="4.5" height="35" fill="#c9c7cc" rx="1" />
      <rect x="24" y="15" width="4.5" height="45" fill="#ff6436" rx="1" />
    </g>

    <g transform="translate(85, -30)">
      <rect x="0" y="15" width="4.5" height="45" fill="#ff6436" rx="1" />
      <rect x="8" y="25" width="4.5" height="35" fill="#c9c7cc" rx="1" />
      <rect x="16" y="5" width="4.5" height="55" fill="#ff6436" rx="1" />
      <rect x="24" y="20" width="4.5" height="40" fill="#ff6436" rx="1" />
    </g>
  </g>
</svg>
