<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <linearGradient id="bg-saas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1b1f" />
      <stop offset="100%" stop-color="#121114" />
    </linearGradient>
    <linearGradient id="ember-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b52" />
      <stop offset="100%" stop-color="#ff6436" />
    </linearGradient>
    <pattern id="dot-grid-saas" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2c2a2f" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="500" fill="url(#bg-saas)" />
  <rect width="400" height="500" fill="url(#dot-grid-saas)" opacity="0.75" />

  <!-- Subtle Structural Framing -->
  <rect x="30" y="30" width="340" height="440" stroke="#2c2a2f" stroke-width="1" rx="16" />

  <!-- Multi-Tenant Cloud Architecture (Generously Padded Isometric Geometry) -->
  <g transform="translate(200, 235)">
    <!-- Layer 3: Database & Shard Cluster (Bottom Plane) -->
    <path d="M-110 70 L0 120 L110 70 L0 20 Z" fill="#151417" stroke="#3c3a3e" stroke-width="1.2" />
    <path d="M-110 80 L0 130 L110 80 L0 30 Z" fill="none" stroke="#2a292d" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Tenant DB Cylinders -->
    <g transform="translate(-50, 65)">
      <ellipse cx="0" cy="0" rx="15" ry="7.5" fill="#1f1e22" stroke="#555358" stroke-width="1.2" />
      <path d="M-15 0 V12 C-15 16 15 16 15 12 V0" fill="#1f1e22" stroke="#555358" stroke-width="1.2" />
    </g>
    <g transform="translate(0, 85)">
      <ellipse cx="0" cy="0" rx="16" ry="8" fill="#1f1e22" stroke="#ff6436" stroke-width="1.5" />
      <path d="M-16 0 V14 C-16 18.5 16 18.5 16 14 V0" fill="#1f1e22" stroke="#ff6436" stroke-width="1.5" />
      <circle cx="0" cy="7" r="3" fill="#ff6436" />
    </g>
    <g transform="translate(50, 65)">
      <ellipse cx="0" cy="0" rx="15" ry="7.5" fill="#1f1e22" stroke="#555358" stroke-width="1.2" />
      <path d="M-15 0 V12 C-15 16 15 16 15 12 V0" fill="#1f1e22" stroke="#555358" stroke-width="1.2" />
    </g>

    <!-- Vertical Circuit Lines -->
    <line x1="-50" y1="55" x2="-50" y2="0" stroke="#3c3a3e" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="0" y1="72" x2="0" y2="18" stroke="#ff6436" stroke-width="1.5" />
    <line x1="50" y1="55" x2="50" y2="0" stroke="#3c3a3e" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Layer 2: Microservice Core (Middle Plane) -->
    <path d="M-125 0 L0 55 L125 0 L0 -55 Z" fill="#18171b" stroke="#555358" stroke-width="1.4" />
    <path d="M-80 0 L-40 18 L-40 -18 L-80 -36 Z" fill="#222026" stroke="#3c3a3e" stroke-width="1" />
    <path d="M-25 18 L15 36 L15 0 L-25 -18 Z" fill="#222026" stroke="#ff6436" stroke-width="1.4" />
    <path d="M30 0 L70 18 L70 -18 L30 -36 Z" fill="#222026" stroke="#3c3a3e" stroke-width="1" />

    <!-- Layer 1: Ingress Gateway Diamond (Top Floating Diamond) -->
    <g transform="translate(0, -85)">
      <path d="M-75 0 L0 34 L75 0 L0 -34 Z" fill="#222027" stroke="#c9c7cc" stroke-width="1.2" />
      <circle cx="0" cy="0" r="14" fill="#151417" stroke="#ff6436" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="url(#ember-grad)" />
      <!-- Orbital Radar Rings -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#ff6436" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.85" />
      <circle cx="0" cy="0" r="42" fill="none" stroke="#555358" stroke-width="0.6" stroke-dasharray="2 3" />
    </g>

    <!-- Ingress Route Arrow to Middle Core -->
    <line x1="0" y1="-70" x2="0" y2="-12" stroke="#ff6436" stroke-width="2" />
    <polygon points="-4,-18 0,-10 4,-18" fill="#ff6436" />
  </g>
</svg>
