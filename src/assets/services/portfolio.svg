<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <linearGradient id="bg-port" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1b1f" />
      <stop offset="100%" stop-color="#121114" />
    </linearGradient>
    <pattern id="dot-grid-port" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2c2a2f" />
    </pattern>
    <pattern id="scanlines" x="0" y="0" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" opacity="0.35" />
    </pattern>
  </defs>

  <rect width="400" height="500" fill="url(#bg-port)" />
  <rect width="400" height="500" fill="url(#dot-grid-port)" opacity="0.75" />

  <rect x="30" y="30" width="340" height="440" stroke="#2c2a2f" stroke-width="1" rx="16" />

  <!-- Editorial Swiss Typographic & Kinetic Geometry -->
  <g transform="translate(200, 240)">
    <!-- Baseline Grid Guides -->
    <line x1="-130" y1="-100" x2="130" y2="-100" stroke="#2c2a2f" stroke-width="0.8" />
    <line x1="-130" y1="-50" x2="130" y2="-50" stroke="#2c2a2f" stroke-width="0.8" />
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#3c3a3e" stroke-width="1.2" />
    <line x1="-130" y1="50" x2="130" y2="50" stroke="#2c2a2f" stroke-width="0.8" />
    <line x1="-130" y1="100" x2="130" y2="100" stroke="#2c2a2f" stroke-width="0.8" />

    <!-- Golden Ratio Spiral & Rectangles -->
    <rect x="-120" y="-90" width="240" height="150" stroke="#3c3a3e" stroke-width="1.2" fill="#141316" fill-opacity="0.6" />
    <rect x="-120" y="-90" width="150" height="150" stroke="#3c3a3e" stroke-width="1" />
    <rect x="30" y="0" width="90" height="60" stroke="#3c3a3e" stroke-width="1" />
    <path d="M-120 60 A150 150 0 0 1 30 -90" stroke="#555358" stroke-width="1.4" stroke-dasharray="3 3" />
    <path d="M30 -90 A90 90 0 0 1 120 0" stroke="#c9c7cc" stroke-width="1.4" />

    <!-- Bold Monogram Architectural Stroke -->
    <path d="M-80 35 V-65 L-50 -10 L-20 -65 V35" stroke="#ffffff" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter" />

    <!-- Kinetic Motion Bézier Curve with Ember Control Handles -->
    <path d="M-120 90 C -30 120, 30 -30, 120 30" stroke="#ff6436" stroke-width="2.5" />
    <line x1="-120" y1="90" x2="-30" y2="120" stroke="#ff6436" stroke-width="1" stroke-dasharray="2 2" />
    <circle cx="-30" cy="120" r="4" fill="#ff6436" />
    <line x1="120" y1="30" x2="30" y2="-30" stroke="#ff6436" stroke-width="1" stroke-dasharray="2 2" />
    <circle cx="30" cy="-30" r="4" fill="#ff6436" />

    <!-- Mini CRT Vector Plate -->
    <g transform="translate(35, -70)">
      <rect width="75" height="50" fill="#1b1a1e" stroke="#3c3a3e" stroke-width="1" rx="4" />
      <rect width="75" height="50" fill="url(#scanlines)" rx="4" />
      <path d="M10 32 Q 22 8, 38 25 T 65 18" stroke="#ff6436" stroke-width="1.5" fill="none" />
    </g>
  </g>
</svg>
